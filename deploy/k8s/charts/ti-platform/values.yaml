# =============================================================================
# ti-platform — default values
#
# Production-ready defaults. Override in environment-specific files:
#   values-dev.yaml    — low-resource, single-replica for dev clusters
#   values-prod.yaml   — HA-tuned, multi-zone, full observability
# =============================================================================

global:
  # Image registry is pluggable for air-gapped / internal mirrors.
  imageRegistry: ""
  imagePullSecrets: []
  # StorageClass applied to every PVC unless a service overrides it.
  # Empty string = use the cluster default.
  storageClass: ""
  # Cluster DNS suffix; change for non-default clusters.
  clusterDomain: cluster.local
  # Enable this on multi-zone clusters to spread replicas across zones.
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
# The chart reads these from an existing Secret named `{release}-secrets`.
# Create it via scripts/create-secrets.sh or an ExternalSecrets Operator.
# Keys expected:
#   POSTGRES_PASSWORD, REDIS_PASSWORD, NATS_PASSWORD,
#   SECRET_KEY, API_KEY, GRAFANA_PASSWORD,
#   ABUSEIPDB_API_KEY, OTX_API_KEY, THREATFOX_API_KEY,
#   MALWAREBAZAAR_API_KEY, VIRUSTOTAL_API_KEY
secrets:
  # Name of the pre-existing Secret. Leave empty to have the chart create
  # one from `secrets.create.*` values (dev only; NOT for production).
  existingSecret: ""
  create:
    enabled: false
    # Only honoured if existingSecret is empty and create.enabled is true.
    # DO NOT commit real values to git. Use --set-file or ExternalSecrets.
    values: {}

# -----------------------------------------------------------------------------
# Common pod hardening applied to every platform pod unless overridden.
# -----------------------------------------------------------------------------
podSecurity:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilitiesDrop: ["ALL"]

# -----------------------------------------------------------------------------
# PriorityClasses — critical data tier must evict workers before itself.
# -----------------------------------------------------------------------------
priorityClasses:
  create: true
  critical:
    name: ti-platform-critical
    value: 1000000
  high:
    name: ti-platform-high
    value: 100000
  default:
    name: ti-platform-default
    value: 10000

# =============================================================================
# DATA TIER
# =============================================================================

# PostgreSQL — disabled by default; use a managed DB in production.
# When disabled, point services at `externalDatabase.*`.
postgresql:
  enabled: false
  # If enabled, Bitnami subchart values go here.
  auth:
    existingSecret: ""   # set to secrets.existingSecret; fields remapped via extraEnv
    username: tiplatform
    database: tiplatform
  primary:
    persistence:
      size: 50Gi
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "4Gi" }
  architecture: replication
  readReplicas:
    replicaCount: 2
    persistence:
      size: 50Gi

externalDatabase:
  host: "postgres.data.svc.cluster.local"
  port: 5432
  database: "tiplatform"
  username: "tiplatform"
  # Password comes from the shared secret (POSTGRES_PASSWORD).

# Redis — JetStream-style cache + sandbox progress. Enable for out-of-box.
redis:
  enabled: true
  architecture: replication
  auth:
    existingSecret: ""   # points at shared secret; key: REDIS_PASSWORD
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      size: 10Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "1",    memory: "1Gi" }
  replica:
    replicaCount: 2
    persistence:
      size: 10Gi
  sentinel:
    enabled: true
    quorum: 2

# NATS JetStream — 3-node cluster for HA.
nats:
  enabled: true
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
  container:
    image:
      tag: "2.10-alpine"

# =============================================================================
# PLATFORM SERVICES — all built from this repo
# =============================================================================

image:
  # Image tag applied to every in-repo service unless overridden per service.
  registry: ""           # e.g. "ghcr.io/your-org"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

api:
  enabled: true
  image:
    repository: ti-platform/api
  replicaCount: 3
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"   }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies: [{type: Percent, value: 25, periodSeconds: 60}]
      scaleUp:
        stabilizationWindowSeconds: 30
        policies: [{type: Percent, value: 100, periodSeconds: 30}]
  pdb:
    minAvailable: 2
  env:
    LOG_LEVEL: INFO
    ENVIRONMENT: production
    SANDBOX_ENABLED: "true"
    CORS_ORIGINS: "https://app.example.com"
  probes:
    startupPath: /health
    livenessPath: /health
    readinessPath: /health
    port: 8000

ingestion:
  enabled: true
  image:
    repository: ti-platform/ingestion
  # Singleton — leader election (via Deployment+Lease) ensures safety under
  # multi-replica rolling updates, but we keep 1 replica at steady state.
  replicaCount: 1
  leaderElection:
    enabled: true
    leaseName: ti-platform-ingestion-leader
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    LOG_LEVEL: INFO
    URLHAUS_ENABLED: "true"
    THREATFOX_ENABLED: "true"
    MALWAREBAZAAR_ENABLED: "true"
    OPENPHISH_ENABLED: "true"
    FEED_POLL_INTERVAL: "3600"

enrichment:
  enabled: true
  image:
    repository: ti-platform/enrichment
  replicaCount: 2
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75
    # Optional KEDA-driven scale on NATS queue depth.
    keda:
      enabled: false
      natsSubject: "enrichment.jobs"
      lagThreshold: "50"
  pdb:
    minAvailable: 1
  geoip:
    # GeoIP DBs fetched by an initContainer from a URL (license key provided
    # via env). Shared via emptyDir; one copy per pod.
    enabled: true
    editionIds: "GeoLite2-City,GeoLite2-ASN"
    licenseKeySecretKey: MAXMIND_LICENSE_KEY   # optional; skipped if absent
  env:
    LOG_LEVEL: INFO
    ENRICHMENT_WORKERS: "4"

correlation:
  enabled: true
  image:
    repository: ti-platform/correlation
  replicaCount: 1
  leaderElection:
    enabled: true
    leaseName: ti-platform-correlation-leader
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "768Mi" }
  env:
    LOG_LEVEL: INFO
    ALERT_MIN_CONFIDENCE: "60"
    BASELINE_MIN_SAMPLES: "20"
    BASELINE_Z_SCORE_THRESHOLD: "3.0"
    BASELINE_FLUSH_INTERVAL: "300"
    SUGGESTION_MIN_TRIGGERS: "5"
    BASELINE_AUTO_APPLY_CONFIDENCE: "0.85"
    BASELINE_AUTO_APPLY_DELAY_HOURS: "24"

icap:
  enabled: true
  image:
    repository: ti-platform/icap
  replicaCount: 2
  service:
    # LoadBalancer for external proxy integration (on-prem: use MetalLB;
    # cloud: cloud LB). Switch to NodePort if no LB controller available.
    type: LoadBalancer
    port: 1344
    # Preserve client IP for security logging.
    externalTrafficPolicy: Local
    # annotations left empty; set cloud-LB specific hints in values-prod.yaml
    annotations: {}
    loadBalancerIP: ""
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1
  env:
    LOG_LEVEL: INFO
    ICAP_MAX_CONNECTIONS: "100"

logserver:
  enabled: true
  image:
    repository: ti-platform/logserver
  replicaCount: 2
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    udpPort: 514
    tcpPort: 514
    httpPort: 9514
    annotations: {}
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

sandbox:
  enabled: true
  image:
    repository: ti-platform/sandbox
  replicaCount: 1
  # Sandbox worker spawns ephemeral K8s Jobs inside a dedicated namespace
  # (`{release}-sandbox-jobs`) with its own ServiceAccount.
  jobs:
    namespace: ""            # defaults to {release}-sandbox-jobs
    runtimeClassName: ""     # set to "gvisor" or "kata" for hardened isolation
    analysisImage: "ti-platform/sandbox-analysis:1.0.0"
    analysisTimeoutSeconds: 120
    ttlSecondsAfterFinished: 600
  storage:
    # Artifact store: either S3-compatible (recommended) or an RWX PVC.
    mode: s3                 # "s3" | "pvc"
    s3:
      # When minio.enabled=true the chart auto-wires these.
      endpoint: ""
      bucket: "ti-sandbox-artifacts"
      region: "us-east-1"
      accessKeyIdSecretKey: S3_ACCESS_KEY_ID
      secretAccessKeySecretKey: S3_SECRET_ACCESS_KEY
    pvc:
      storageClass: ""       # must support ReadWriteMany if mode=pvc
      size: 50Gi
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    keda:
      # KEDA scales sandbox workers on NATS sandbox-queue depth.
      enabled: false
      natsSubject: "sandbox.jobs"
      lagThreshold: "10"
  env:
    LOG_LEVEL: INFO
    SANDBOX_ENGINE: k8s-jobs
    LOCAL_SANDBOX_DYNAMIC: "true"

frontend:
  enabled: true
  image:
    repository: ti-platform/frontend
  replicaCount: 3
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "384Mi" }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 2
  env:
    NODE_ENV: production
  publicEnv:
    NEXT_PUBLIC_API_URL: "/api"

# =============================================================================
# INGRESS / TLS
# =============================================================================

ingress:
  enabled: true
  className: nginx
  # cert-manager handles Let's Encrypt. Set clusterIssuer to your issuer.
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
  hosts:
    api:
      host: api.example.com
      paths: [{ path: /, pathType: Prefix }]
    app:
      host: app.example.com
      paths: [{ path: /, pathType: Prefix }]
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/enable-real-ip: "true"
    # HTTP -> HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

# =============================================================================
# NETWORK POLICY
# =============================================================================

networkPolicy:
  enabled: true
  # Deny-by-default ingress to data tier; platform services opt in via labels.
  dnsEgressCidr: "0.0.0.0/0"   # narrow to CoreDNS CIDR in locked-down envs

# =============================================================================
# OBSERVABILITY
# =============================================================================

monitoring:
  enabled: true
  # kube-prometheus-stack subchart
  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources: { requests: { storage: 100Gi } }
  grafana:
    admin:
      existingSecret: ""            # shared secret; key: GRAFANA_PASSWORD
      userKey: "GRAFANA_USER"
      passwordKey: "GRAFANA_PASSWORD"
    defaultDashboardsEnabled: true
  # ServiceMonitors for each platform service that exposes /metrics.
  serviceMonitors:
    enabled: true
    interval: 30s

# =============================================================================
# OPTIONAL: MinIO for sandbox artifact storage
# =============================================================================

minio:
  enabled: false
  mode: distributed
  statefulset:
    replicaCount: 4
  persistence:
    size: 100Gi
  auth:
    existingSecret: ""      # shared secret
    rootUserSecretKey: S3_ACCESS_KEY_ID
    rootPasswordSecretKey: S3_SECRET_ACCESS_KEY
  defaultBuckets: "ti-sandbox-artifacts"
