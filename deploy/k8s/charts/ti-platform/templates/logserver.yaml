{{- if .Values.logserver.enabled }}
{{- $svc := "logserver" }}
{{- $cfg := .Values.logserver }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ti.labels" . | nindent 8 }}
        {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
      priorityClassName: {{ .Values.priorityClasses.high.name }}
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "ti.podSecurityContext" . | nindent 8 }}
      {{- include "ti.spreadAndAffinity" (dict "ctx" . "svc" $svc) | nindent 6 }}
      containers:
        - name: logserver
          image: {{ include "ti.image" (dict "ctx" . "cfg" $cfg) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # NET_BIND_SERVICE needed only if binding <1024. In K8s the
              # Service LB targets targetPort=5514 / 5514 to avoid this.
          ports:
            - { name: syslog-udp, containerPort: 5514, protocol: UDP }
            - { name: syslog-tcp, containerPort: 5514, protocol: TCP }
            - { name: http, containerPort: 9514, protocol: TCP }
          env:
            - name: API_URL
              value: "http://{{ include "ti.svcName" (dict "ctx" . "svc" "api") }}.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.api.service.port }}"
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "ti.secretName" . }}, key: API_KEY } }
            - name: SYSLOG_UDP_PORT
              value: "5514"
            - name: SYSLOG_TCP_PORT
              value: "5514"
            - name: LOGSERVER_HTTP_PORT
              value: "9514"
          resources: {{- toYaml $cfg.resources | nindent 12 }}
          # The log server exposes /ingest only; it has no healthz route today.
          # TCP-check the listener as a liveness signal.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
# External LB for syslog sources. UDP and TCP use separate Services
# because most LB controllers cannot mix L4 protocols in one Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}-udp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ti.labels" . | nindent 4 }}
    app.kubernetes.io/component: logserver-udp
  annotations: {{- toYaml $cfg.service.annotations | nindent 4 }}
spec:
  type: {{ $cfg.service.type }}
  externalTrafficPolicy: {{ $cfg.service.externalTrafficPolicy }}
  ports:
    - { name: syslog-udp, port: {{ $cfg.service.udpPort }}, targetPort: syslog-udp, protocol: UDP }
  selector: {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}-tcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ti.labels" . | nindent 4 }}
    app.kubernetes.io/component: logserver-tcp
  annotations: {{- toYaml $cfg.service.annotations | nindent 4 }}
spec:
  type: {{ $cfg.service.type }}
  externalTrafficPolicy: {{ $cfg.service.externalTrafficPolicy }}
  ports:
    - { name: syslog-tcp, port: {{ $cfg.service.tcpPort }}, targetPort: syslog-tcp, protocol: TCP }
  selector: {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
