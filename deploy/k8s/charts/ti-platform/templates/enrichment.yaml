{{- if .Values.enrichment.enabled }}
{{- $svc := "enrichment" }}
{{- $cfg := .Values.enrichment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ti.labels" . | nindent 8 }}
        {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
      priorityClassName: {{ .Values.priorityClasses.default.name }}
      terminationGracePeriodSeconds: 45
      securityContext: {{- include "ti.podSecurityContext" . | nindent 8 }}
      {{- include "ti.spreadAndAffinity" (dict "ctx" . "svc" $svc) | nindent 6 }}
      {{- if $cfg.geoip.enabled }}
      initContainers:
        - name: geoip-fetch
          image: curlimages/curl:8.8.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -z "${MAXMIND_LICENSE_KEY:-}" ]; then
                echo "MAXMIND_LICENSE_KEY not set — skipping GeoIP download"
                exit 0
              fi
              for edition in $(echo "$EDITIONS" | tr ',' ' '); do
                url="https://download.maxmind.com/app/geoip_download?edition_id=${edition}&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz"
                echo "fetching $edition"
                curl -fsSL "$url" | tar -xz -C /geoip --strip-components=1 "*/${edition}.mmdb" || true
              done
              ls -la /geoip/
          env:
            - name: EDITIONS
              value: {{ $cfg.geoip.editionIds | quote }}
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ti.secretName" . }}
                  key: {{ $cfg.geoip.licenseKeySecretKey }}
                  optional: true
          volumeMounts:
            - { name: geoip, mountPath: /geoip }
          securityContext: {{- include "ti.containerSecurityContext" . | nindent 12 }}
      {{- end }}
      containers:
        - name: enrichment
          image: {{ include "ti.image" (dict "ctx" . "cfg" $cfg) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "ti.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "ti.commonEnv" . | nindent 12 }}
            - name: GEOIP_DB_PATH
              value: /geoip/GeoLite2-City.mmdb
            - name: GEOIP_ASN_DB_PATH
              value: /geoip/GeoLite2-ASN.mmdb
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources: {{- toYaml $cfg.resources | nindent 12 }}
          # Enrichment is a NATS subscriber — no HTTP endpoint today.
          # Use trivial exec probes; switch to httpGet once /healthz lands.
          livenessProbe:
            exec: { command: ["/bin/true"] }
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec: { command: ["/bin/true"] }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - { name: geoip, mountPath: /geoip, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: geoip
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $cfg.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "ti.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 6 }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if and $cfg.autoscaling.enabled $cfg.autoscaling.keda.enabled }}
---
# KEDA ScaledObject — scales enrichment on NATS consumer lag.
# Requires KEDA installed (`kedacore/keda` chart).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}-keda
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "ti.svcName" (dict "ctx" . "svc" $svc) }}
  minReplicaCount: {{ $cfg.autoscaling.minReplicas }}
  maxReplicaCount: {{ $cfg.autoscaling.maxReplicas }}
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: "{{ .Release.Name }}-nats.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}:8222"
        account: "$G"
        stream: "ENRICHMENT"
        consumer: "enrichment-workers"
        lagThreshold: {{ $cfg.autoscaling.keda.lagThreshold | quote }}
{{- end }}
{{- end }}
