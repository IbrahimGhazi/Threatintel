{{/*
  One ServiceAccount per service, even when RBAC isn't strictly needed.
  Gives us a clear identity for NetworkPolicy, audit logs, and future
  workload-identity bindings (GKE WI, IRSA, Azure AD WI).
*/}}
{{- $svcs := list
    (dict "name" "api"          "key" "api")
    (dict "name" "ingestion"    "key" "ingestion")
    (dict "name" "enrichment"   "key" "enrichment")
    (dict "name" "correlation"  "key" "correlation")
    (dict "name" "icap"         "key" "icap")
    (dict "name" "logserver"    "key" "logserver")
    (dict "name" "sandbox"      "key" "sandbox")
    (dict "name" "frontend"     "key" "frontend")
    (dict "name" "attack-paths" "key" "attackPaths")
}}
{{- range $entry := $svcs }}
{{- $svc := $entry.name }}
{{- $cfg := index $.Values $entry.key }}
{{- if $cfg.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $.Release.Name $svc }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ti.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc }}
    app.kubernetes.io/component: {{ $svc }}
automountServiceAccountToken: true
---
{{- end }}
{{- end }}
