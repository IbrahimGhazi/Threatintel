{{/*
  One ServiceAccount per service, even when RBAC isn't strictly needed.
  Gives us a clear identity for NetworkPolicy, audit logs, and future
  workload-identity bindings (GKE WI, IRSA, Azure AD WI).
*/}}
{{- range $svc := list "api" "ingestion" "enrichment" "correlation" "icap" "logserver" "sandbox" "frontend" }}
{{- $cfg := index $.Values $svc }}
{{- if $cfg.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $.Release.Name $svc }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ti.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc }}
    app.kubernetes.io/component: {{ $svc }}
automountServiceAccountToken: true
---
{{- end }}
{{- end }}
