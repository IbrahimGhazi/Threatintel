{{/*
  Optional: chart-managed Secret. Only for local/dev — in production you
  MUST either:
    (a) pre-create the Secret (and set secrets.existingSecret), OR
    (b) use ExternalSecrets Operator / Sealed Secrets / Vault Agent.
*/}}
{{- if and (not .Values.secrets.existingSecret) .Values.secrets.create.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ti.labels" . | nindent 4 }}
  annotations:
    # Prevent helm from overwriting a manually-rotated secret.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.create.values }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
