server {
    listen 80;
    server_name _;

    # Allow file uploads up to 50 MB (matches the API's limit)
    client_max_body_size 50m;

    # Redirect all HTTP to HTTPS in production
    # Uncomment the next two lines when TLS is configured:
    # return 301 https://$host$request_uri;

    # ── Sandbox SSE progress stream (must be before /api/ block) ─
    location ~ ^/api/sandbox/[0-9a-f]+/progress$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;

        # SSE-specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        chunked_transfer_encoding on;
        gzip off;
    }

    # ── API Backend ──────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Pass request ID for distributed tracing
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # EDL feeds served with longer cache hints
    location /api/edl/ {
        limit_req zone=edl burst=5 nodelay;

        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # EDL consumers should poll no faster than every 5 minutes
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Frontend ─────────────────────────────────────
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Health check endpoint ─────────────────────────
    location /health {
        access_log off;
        rewrite ^/health$ /health break;
        proxy_pass http://$api_upstream;
    }
}
