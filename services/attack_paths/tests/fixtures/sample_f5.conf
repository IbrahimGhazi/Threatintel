ltm node app-srv-01 {
    address 10.20.30.41
}
ltm node app-srv-02 {
    address 10.20.30.42
}
ltm node app-srv-03 {
    address 10.20.30.43
}
ltm pool app-prod-pool {
    load-balancing-mode round-robin
    members {
        app-srv-01:8443 {
            address 10.20.30.41
            session monitor-enabled
            state up
        }
        app-srv-02:8443 {
            address 10.20.30.42
            session monitor-enabled
            state up
        }
        app-srv-03:8443 {
            address 10.20.30.43
            session monitor-enabled
            state down
        }
    }
}
ltm virtual app-prod-vs {
    destination 203.0.113.20:443
    ip-protocol tcp
    pool app-prod-pool
    profiles {
        clientssl { context clientside }
    }
}
ltm monitor http app-monitor {
    interval 5
    timeout 16
}
