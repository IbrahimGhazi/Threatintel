#config-version=FGT100E-7.2.5-FW-build1517-230718:opmode=0:vdom=0
config system global
    set hostname "fgt-edge-01"
end
config system zone
    edit "untrust"
        set interface "wan1"
    next
    edit "dmz"
        set interface "port2"
    next
    edit "inside"
        set interface "port3"
    next
end
config firewall address
    edit "web-srv"
        set subnet 10.20.30.40 255.255.255.255
    next
    edit "dmz-net"
        set subnet 10.20.30.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "all-servers"
        set member "web-srv" "dmz-net"
    next
end
config firewall service custom
    edit "https"
        set protocol TCP
        set tcp-portrange 443
    next
    edit "http"
        set protocol TCP
        set tcp-portrange 80
    next
end
config firewall service group
    edit "web-services"
        set member "http" "https"
    next
end
config firewall policy
    edit 1
        set name "allow-web-in"
        set srcintf "untrust"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "web-srv"
        set service "web-services"
        set action accept
        set status enable
    next
    edit 99
        set name "deny-all"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
    next
end
